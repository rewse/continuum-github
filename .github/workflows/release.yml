name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Setup Aikido Safe Chain
        uses: rewse/actions/setup-safe-chain@99b5a2336376175cd5974bb17c9958c34e2b7c07  # v1.1.12

      # The 96-hour cooldown for the isolated build environment comes from
      # [tool.uv] exclude-newer in pyproject.toml.
      - name: Build package
        run: uv build

      # A tag pushed by hand can point at a commit whose __version__ differs,
      # which would publish misnamed assets.
      - name: Check the tag against the built version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: test -f "dist/continuum_github-${TAG_NAME#v}-py3-none-any.whl"

      - name: Generate Release Notes
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4.9.1
        with:
          args: --latest --strip header

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.content }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "$RELEASE_NOTES" \
            --verify-tag

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber
