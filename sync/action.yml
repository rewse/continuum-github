name: Continuum sync
description: Sync AWS Security Agent findings into GitHub issues and write their issue sections.

inputs:
  agent-space-id:
    description: ID of the AWS Security Agent space.
    required: true
  aws-region:
    description: AWS Region of the agent space.
    default: us-east-1
  bedrock-model-id:
    description: Bedrock model or inference profile ID, such as us.anthropic.claude-sonnet-5-5, that writes the issue sections. Empty skips the model.
    default: ""
  bedrock-region:
    description: AWS Region that Bedrock is called in. Empty uses aws-region.
    default: ""
  github-token:
    description: Token that reads and writes issues in the report repository. Keep the default; the actions read state only from issues that github-actions[bot] opened in the calling repository, so another token makes sync file every finding again.
    default: ${{ github.token }}
  language:
    description: Locale, such as ja_JP or en_US, of the text the model writes. Empty uses en_US.
    default: en_US
  mention:
    description: Mention added to urgent findings, such as a GitHub handle. Empty adds none.
    default: ""
  report-repository:
    description: Repository, as owner/name, that holds the finding issues. Keep the default; the actions read state only from issues that github-actions[bot] opened in the calling repository, so another repository makes sync file every finding again.
    default: ${{ github.repository }}
  targets:
    description: Path to the targets file, relative to the workspace.
    default: targets.toml

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Setup Aikido Safe Chain
      uses: rewse/actions/setup-safe-chain@99b5a2336376175cd5974bb17c9958c34e2b7c07  # v1.1.12

    - name: Install dependencies
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH/.." --locked --no-dev --safe-chain-skip-minimum-package-age

    - name: Sync findings
      id: sync
      shell: bash
      # The targets path is relative to the caller's checkout.
      working-directory: ${{ github.workspace }}
      run: uv run --project "$GITHUB_ACTION_PATH/.." --no-sync continuum-github sync --targets "$TARGETS"
      env:
        AGENT_SPACE_ID: ${{ inputs.agent-space-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MENTION: ${{ inputs.mention }}
        REPORT_REPOSITORY: ${{ inputs.report-repository }}
        TARGETS: ${{ inputs.targets }}

    - name: Write issue sections
      if: steps.sync.outputs.needs-sections != '0' && inputs.bedrock-model-id != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      run: uv run --project "$GITHUB_ACTION_PATH/.." --no-sync continuum-github sections --targets "$TARGETS"
      env:
        AGENT_SPACE_ID: ${{ inputs.agent-space-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        BEDROCK_MODEL_ID: ${{ inputs.bedrock-model-id }}
        BEDROCK_REGION: ${{ inputs.bedrock-region }}
        CONTINUUM_LANGUAGE: ${{ inputs.language }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MENTION: ${{ inputs.mention }}
        REPORT_REPOSITORY: ${{ inputs.report-repository }}
        TARGETS: ${{ inputs.targets }}
