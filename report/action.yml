name: Continuum report
description: Build the weekly Japanese report of AWS Security Agent findings, upload it as an artifact, and publish it as an issue.

inputs:
  agent-space-id:
    description: ID of the AWS Security Agent space.
    required: true
  aws-region:
    description: AWS Region of the agent space.
    default: us-east-1
  github-token:
    description: Token that reads and writes issues in the report repository.
    default: ${{ github.token }}
  kiro-api-key:
    description: Kiro API key used to write the report.
    required: true
  mention:
    description: Mention added to urgent findings, such as a GitHub handle. Empty adds none.
    default: ""
  report-repository:
    description: Repository, as owner/name, that holds the finding issues.
    default: ${{ github.repository }}
  targets:
    description: Path to the targets file, relative to the workspace.
    default: targets.toml

outputs:
  html-url:
    description: URL of the uploaded HTML report artifact.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 24

    - name: Setup Aikido Safe Chain
      uses: rewse/actions/setup-safe-chain@99b5a2336376175cd5974bb17c9958c34e2b7c07  # v1.1.12

    - name: Install dependencies
      shell: bash
      run: uv sync --project "$GITHUB_ACTION_PATH/.." --locked --no-dev --safe-chain-skip-minimum-package-age

    - name: Install npm dependencies
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH/.." --ignore-scripts

    - name: Install Kiro CLI
      shell: bash
      # The official installer is allowed as an exception to pinned installs.
      run: curl -fsSL https://cli.kiro.dev/install | bash

    - name: Build report
      shell: bash
      # The targets path is relative to the caller's checkout.
      working-directory: ${{ github.workspace }}
      run: |
        VISUAL_EXPLAINER_DIR="$GITHUB_ACTION_PATH/../node_modules/visual-explainer/plugins/visual-explainer" \
          uv run --project "$GITHUB_ACTION_PATH/.." --no-sync continuum-scan report build --targets "$TARGETS" --out "$RUNNER_TEMP/report"
      env:
        AGENT_SPACE_ID: ${{ inputs.agent-space-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        KIRO_API_KEY: ${{ inputs.kiro-api-key }}
        MENTION: ${{ inputs.mention }}
        REPORT_REPOSITORY: ${{ inputs.report-repository }}
        TARGETS: ${{ inputs.targets }}

    - name: Upload HTML report
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        path: ${{ runner.temp }}/report/report.ja.html
        archive: false
        retention-days: 400
        if-no-files-found: warn

    - name: Publish report
      shell: bash
      working-directory: ${{ github.workspace }}
      run: uv run --project "$GITHUB_ACTION_PATH/.." --no-sync continuum-scan report publish --dir "$RUNNER_TEMP/report" --html-url "$HTML_URL"
      env:
        AGENT_SPACE_ID: ${{ inputs.agent-space-id }}
        AWS_REGION: ${{ inputs.aws-region }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        HTML_URL: ${{ steps.upload.outputs.artifact-url }}
        MENTION: ${{ inputs.mention }}
        REPORT_REPOSITORY: ${{ inputs.report-repository }}
